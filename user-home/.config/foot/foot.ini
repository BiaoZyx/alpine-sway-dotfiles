[main]
font = JetBrainsMono Nerd Font Mono:size=10, Noto Sans Mono CJK SC:size=10
title = xterm

[colors-dark]
alpha=0.8

foreground=E0D8F5
background=08060E
selection-foreground=F2EFFF
selection-background=2B1E6E
cursor=08060E C4BAE8

# 暗色 (regular0-7)
regular0=3D2D6E      # overlay0 深紫灰
regular1=ff728f      # 红
regular2=7fff9a      # 绿
regular3=ffda72      # 黄
regular4=7A6BCE      # blue 靛蓝紫
regular5=C4BAE8      # mauve 薰衣草
regular6=89dceb      # sky 天蓝
regular7=E0D8F5      # text 浅紫白

# 亮色 (bright0-7)
bright0=5C4FA0       # overlay1 亮紫灰
bright1=ff9fb2       # 亮红
bright2=a5ffb8       # 亮绿
bright3=ffe7a5       # 亮黄
bright4=D4C9FF       # lavender 亮薰衣草
bright5=C4BAE8       # mauve
bright6=94e2d5       # teal 亮青
bright7=F2EFFF       # 亮白紫

dim-blend-towards=black
