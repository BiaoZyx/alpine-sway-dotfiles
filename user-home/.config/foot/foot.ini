[main]
font = JetBrainsMono Nerd Font Mono:size=10, Noto Sans Mono CJK SC:size=10
title = xterm

[colors-dark]
alpha=0.8

# 前景与背景
foreground=d1cbe0
background=16131c

# 光标与选中
cursor=16131c c4bae8
selection-foreground=f2efff
selection-background=3e3852

# 正常色
regular0=23202a      # 黑
regular1=e5748a      # 红
regular2=5eb86d      # 绿
regular3=dfc48a      # 黄
regular4=6b9bf2      # 蓝
regular5=c4bae8      # 紫
regular6=7dd3e8      # 青
regular7=d1cbe0      # 白

# 亮色
bright0=423c50       # 亮黑
bright1=f08c9f       # 亮红
bright2=6ac47c       # 亮绿
bright3=eed59b       # 亮黄
bright4=86aff5       # 亮蓝
bright5=dcd4f5       # 亮紫
bright6=93e2f2       # 亮青
bright7=e6e0ed       # 亮白

dim-blend-towards=black
