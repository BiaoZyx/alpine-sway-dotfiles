[main]
font=JetBrainsMono Nerd Font Mono:size=11, Noto Sans Mono CJK SC:size=11
lines=16
width=40
horizontal-pad=10
vertical-pad=8
inner-pad=2
layer=overlay
dpi-aware=auto
show-actions=true
exit-on-keyboard-focus-loss=no

[border]
radius=0
width=2

[colors]
# 纯黑紫底色，和 Waybar 栏底、Sway 窗口底色一致
background=08060Eff
# 浅紫白文字，对应 Waybar 的 @text
text=E0D8F5ff
# 提示符，用亮薰衣草紫
prompt=C4BAE8ff
# 匹配字符，用高亮薰衣草紫
match=C4BAE8ff
# 选中项背景，对应 Waybar 模块的 surface1 或 surface2（深紫灰）
selection=1A1726ff
# 选中项文字，纯亮白紫
selection-text=F2EFFFff
# 选中项匹配字符，最高亮强调
selection-match=D4C9FFff
# 边框，对应 Waybar 的边框紫
border=7A6BCEff
# 右侧计数数字，暗紫灰
counter=5C4FA0ff
