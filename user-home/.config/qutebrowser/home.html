<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主页</title>
<style>
:root{
  --primary:#D0BCFF;
  --on-primary:#381E72;
  --primary-container:#4F378B;
  --on-primary-container:#EADDFF;
  --secondary:#CCC2DC;
  --on-secondary:#332D41;
  --secondary-container:#4A4458;
  --on-secondary-container:#E8DEF8;
  --tertiary:#EFB8C8;
  --on-tertiary:#492532;
  --tertiary-container:#633B48;
  --on-tertiary-container:#FFD8E4;
  --surface:#141218;
  --on-surface:#E6E0E9;
  --on-surface-variant:#CAC4D0;
  --outline:#938F99;
  --outline-variant:#49454F;
  --surface-container-lowest:#0F0D13;
  --surface-container-low:#1D1B20;
  --surface-container:#211F26;
  --surface-container-high:#2B2930;
  --surface-container-highest:#36343B;
  --state-hover:rgba(230,224,233,.08);
  --state-pressed:rgba(230,224,233,.1);
  --primary-blob:#D0BCFF26;
  --tertiary-blob:#EFB8C821;
  --elevation-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --elevation-3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
}
html[data-theme="light"]{
  --primary:#6750A4;
  --on-primary:#FFFFFF;
  --primary-container:#EADDFF;
  --on-primary-container:#21005D;
  --secondary:#625B71;
  --on-secondary:#FFFFFF;
  --secondary-container:#E8DEF8;
  --on-secondary-container:#1D192B;
  --tertiary:#7D5260;
  --on-tertiary:#FFFFFF;
  --tertiary-container:#FFD8E4;
  --on-tertiary-container:#31111D;
  --surface:#FEF7FF;
  --on-surface:#1D1B20;
  --on-surface-variant:#49454F;
  --outline:#79747E;
  --outline-variant:#CAC4D0;
  --surface-container-lowest:#FFFFFF;
  --surface-container-low:#F7F2FA;
  --surface-container:#F3EDF7;
  --surface-container-high:#ECE6F0;
  --surface-container-highest:#E6E0E9;
  --state-hover:rgba(29,27,32,.08);
  --state-pressed:rgba(29,27,32,.1);
  --primary-blob:#6750A41F;
  --tertiary-blob:#FFD8E47F;
  --elevation-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --elevation-3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","Google Sans","Roboto","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--surface);
  color:var(--on-surface);
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:0;height:0;background:transparent !important}
::-webkit-scrollbar-track{background:transparent !important;border:none !important}
::-webkit-scrollbar-corner{background:transparent !important}
::-webkit-scrollbar-thumb{border:none !important;background:transparent !important}
#sb{position:fixed;right:1px;top:0;width:8px;min-height:28px;border-radius:20px;background:var(--outline);opacity:.6;z-index:9999;cursor:ns-resize;transition:width .18s ease,opacity .18s ease;display:none}
#sb:hover,#sb.sb-drag{width:16px;background:var(--outline);opacity:.95}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg::before,.bg::after{content:"";position:absolute;border-radius:50%;filter:blur(100px)}
.bg::before{width:460px;height:460px;background:var(--primary-blob);top:-150px;left:-110px}
.bg::after{width:400px;height:400px;background:var(--tertiary-blob);bottom:-170px;right:-130px}
.container{max-width:760px;margin:0 auto;padding:2vh 24px 2vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:3vh}
.themes-wrap{position:relative}
.theme-slider{
  position:relative;width:88px;height:40px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;
}
.theme-slider .ts-track{position:absolute;left:6px;right:6px;top:17px;height:20px;border-radius:10px;background:var(--surface-container-high)}
.theme-slider .ts-marks{position:absolute;inset:0;pointer-events:none}
.theme-slider .ts-mark{position:absolute;top:27px;left:0;width:14px;height:14px;transform:translate(-50%,-50%);display:grid;place-items:center;color:var(--on-surface-variant);transition:opacity .25s}
.theme-slider .ts-mark svg{width:13px;height:13px;fill:currentColor}
.theme-slider .ts-mark.active{opacity:0}
.theme-slider .ts-thumb{
  position:absolute;top:14px;left:0;width:26px;height:26px;border-radius:50%;
  background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  box-shadow:var(--elevation-2);
  pointer-events:none;z-index:2;
}
.theme-slider .ts-thumb .ts-ic{display:grid;place-items:center}
.theme-slider .ts-thumb svg{width:14px;height:14px;fill:currentColor}
.theme-slider.ready .ts-thumb{transition:left .25s cubic-bezier(.4,0,.2,1)}
.theme-slider.drag .ts-thumb{transition:none}
.date{font-size:13px;color:var(--on-surface-variant);letter-spacing:.4px}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  display:grid;place-items:center;color:var(--on-surface-variant);
  background:transparent;position:relative;overflow:hidden;transition:background .2s;
}
.icon-btn:hover{background:var(--state-hover)}
.icon-btn:active{background:var(--state-pressed)}
.icon-btn svg{width:22px;height:22px;fill:currentColor}
.hero{margin-bottom:36px}
.greeting{font-size:25px;font-weight:500}
.clock{
  margin-top:10px;font-size:86px;font-weight:300;letter-spacing:-2px;line-height:1;
  font-variant-numeric:tabular-nums;
}
.search-wrap{position:relative;z-index:5}
.search{
  display:flex;align-items:center;gap:8px;height:58px;padding:0 6px 0 18px;
  border-radius:29px;background:var(--surface-container-high);
  border:1px solid transparent;box-shadow:var(--elevation-1);
  transition:background .2s,box-shadow .2s;
}
.search:focus-within{
  background:var(--surface-container-highest);
  box-shadow:0 0 0 2px var(--primary-container),var(--elevation-1);
}
.search .mag{width:22px;height:22px;fill:var(--on-surface-variant);flex:none}
.search input{
  flex:1;min-width:0;height:100%;border:none;background:transparent;
  color:var(--on-surface);font-size:16px;outline:none;padding:0 6px;font-family:inherit;
}
.search input::placeholder{color:var(--on-surface-variant)}
.divider{width:1px;height:26px;background:var(--outline-variant);flex:none}
.engine{
  display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;
  border-radius:21px;border:none;cursor:pointer;position:relative;overflow:hidden;
  background:var(--surface-container);color:var(--primary);
  font-size:14px;font-weight:500;font-family:inherit;
  transition:background .2s;
}
.engine:hover{background:var(--surface-container-highest)}
.engine svg{width:22px;height:22px;fill:currentColor;flex:none}
.engine-menu{
  position:absolute;top:66px;right:0;min-width:252px;padding:6px;
  background:var(--surface-container-highest);border-radius:16px;
  box-shadow:var(--elevation-3);display:none;z-index:20;
}
.engine-menu.open{display:block}
.engine-menu .item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  cursor:pointer;font-size:14px;color:var(--on-surface);position:relative;overflow:hidden;transition:background .15s;
}
.engine-menu .item svg{width:20px;height:20px;fill:currentColor;flex:none}
.engine-menu .item:hover{background:var(--surface-container)}
.engine-menu .item.active{color:var(--primary);background:var(--state-pressed)}
.engine-menu .item .name{flex:1}
.engine-menu .item .hint{font-size:12px;color:var(--on-surface-variant)}
.engine-menu .item .check{display:none}
.engine-menu .item.active .check{display:flex;align-items:center;flex:none}
.engine-menu .item.active .check svg{color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:18px;background:var(--surface-container);
  color:var(--on-surface);text-decoration:none;font-size:13px;border:1px solid transparent;
  box-shadow:var(--elevation-1);max-width:280px;
  transition:transform .15s,box-shadow .15s,background .2s;
}
.chip:hover{background:var(--surface-container-high);box-shadow:var(--elevation-3);transform:translateY(-1px)}
.chip svg{width:16px;height:16px;fill:var(--primary);flex:none}
.chip .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section-title{
  margin:40px 0 14px;font-size:12px;font-weight:500;letter-spacing:1.4px;
  color:var(--on-surface-variant);
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:16px;background:var(--surface-container-low);
  text-decoration:none;color:var(--on-surface);
  box-shadow:var(--elevation-1);border:1px solid transparent;
  transition:transform .18s ease,box-shadow .18s ease,background .2s;
}
.card:hover{background:var(--surface-container);box-shadow:var(--elevation-3);transform:translateY(-2px)}
.card:active{transform:translateY(0)}
.card .icon{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
}
.card .icon svg{width:24px;height:24px;fill:currentColor}
.card .name{font-size:15px;font-weight:500}
.card .domain{font-size:11.5px;color:var(--on-surface-variant);margin-top:2px;word-break:break-all}
.card:focus-visible,.engine:focus-visible,.icon-btn:focus-visible,.engine-menu .item:focus-visible{
  outline:2px solid var(--primary);outline-offset:2px;
}
.ripple{
  position:absolute;border-radius:50%;background:currentColor;opacity:.2;
  transform:scale(0);animation:rip .5s ease-out;pointer-events:none;z-index:1;
}
@keyframes rip{to{transform:scale(1);opacity:0}}
.footer{margin-top:46px;text-align:center;font-size:12px;color:var(--on-surface-variant);letter-spacing:.3px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:40px 0 14px}
.section-head .section-title{margin:0}
.icon-btn.small{width:34px;height:34px}
.icon-btn.small svg{width:18px;height:18px}
.icon-btn.active{color:var(--primary);background:var(--state-hover)}
.edit-bar{display:none;flex-wrap:wrap;gap:8px;margin:-2px 0 16px}
body.editing .edit-bar{display:flex}
.tbtn{display:inline-flex;align-items:center;position:relative;overflow:hidden;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;background:var(--secondary-container);color:var(--on-secondary-container);transition:filter .15s,background .15s}
.tbtn:hover{filter:brightness(1.12)}
.tbtn svg{width:16px;height:16px;fill:currentColor}
.tbtn.primary{background:var(--primary);color:var(--on-primary)}
.card .meta{display:flex;flex-direction:column;min-width:0}
.card .name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .domain{font-size:11.5px;color:var(--on-surface-variant);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes jiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-.8deg)}75%{transform:rotate(.8deg)}}
body.editing .card{animation:jiggle .45s ease-in-out infinite;transition:background .2s}
body.editing .card:hover{transform:none}
.card-actions{position:absolute;top:6px;right:6px;display:none;gap:4px;z-index:2}
body.editing .card-actions{display:flex}
.cbtn{width:26px;height:26px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;background:var(--surface-container-highest);color:var(--on-surface-variant);box-shadow:var(--elevation-1);transition:background .15s,color .15s}
.cbtn svg{width:14px;height:14px;fill:currentColor}
.cbtn.edit:hover{background:var(--primary);color:var(--on-primary)}
.cbtn.del{color:#ef5350}
.cbtn.del:hover{background:#ef5350;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.open{display:flex}
.dialog{width:100%;max-width:400px;background:var(--surface-container-high);border-radius:28px;padding:24px;box-shadow:var(--elevation-3);animation:rise .2s ease}
@keyframes rise{from{opacity:0;transform:scale(.96) translateY(8px)}}
.dialog h3{margin:0 0 18px;font-size:18px;font-weight:500}
.field{display:block;margin-bottom:16px}
.field label,.flabel{display:block;font-size:12px;color:var(--on-surface-variant);margin-bottom:6px}
.field input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--outline-variant);background:var(--surface-container);color:var(--on-surface);font-size:15px;outline:none;font-family:inherit}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-container)}
.icon-picker{display:flex;flex-wrap:wrap;gap:8px;max-height:132px;overflow-y:auto;padding:2px}
.ipick{width:40px;height:40px;border-radius:12px;border:2px solid transparent;background:var(--surface-container);color:var(--on-surface-variant);display:grid;place-items:center;cursor:pointer;flex:none}
.ipick svg{width:20px;height:20px;fill:currentColor}
.ipick:hover{background:var(--surface-container-highest)}
.ipick.selected{background:var(--primary-container);color:var(--on-primary-container);border-color:var(--primary)}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.dbtn{height:40px;padding:0 18px;border-radius:20px;border:none;cursor:pointer;position:relative;overflow:hidden;font-size:14px;font-weight:500;font-family:inherit;transition:filter .15s}
.dbtn:hover{filter:brightness(1.12)}
.dbtn.cancel{background:var(--secondary-container);color:var(--on-secondary-container)}
.dbtn.save{background:var(--primary);color:var(--on-primary)}
.toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,16px);background:var(--on-surface);color:var(--surface);padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;box-shadow:var(--elevation-3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
<script>
(function(){
  var mode=localStorage.getItem('m2theme')||'auto';
  var t=mode;
  if(mode==='auto'){
    t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
</head>
<body>
<div class="bg"></div>
<div id="sb"></div>
<div class="container">
  <header class="topbar">
    <div class="date" id="date"></div>
    <div class="theme-slider" id="themeSlider" title="主题：左深色 中自动 右浅色">
      <div class="ts-track"></div>
      <div class="ts-marks">
        <span class="ts-mark" data-mode="dark"></span>
        <span class="ts-mark" data-mode="auto"></span>
        <span class="ts-mark" data-mode="light"></span>
      </div>
      <div class="ts-thumb"><span class="ts-ic"></span></div>
    </div>
  </header>
  <main>
    <div class="hero">
      <div class="greeting" id="greeting"></div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="search-wrap">
      <div class="search">
        <svg class="mag" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="q" type="text" placeholder="搜索或输入网址" autocomplete="off" spellcheck="false">
        <div class="divider"></div>
        <button class="engine" id="engineBtn"></button>
      </div>
      <div class="engine-menu" id="engineMenu" role="menu"></div>
    </div>
    <div id="bmSection" hidden>
      <div class="section-title">快速书签</div>
      <div class="chips" id="bmBar"></div>
    </div>
    <div class="section-head">
      <div class="section-title">常用链接</div>
      <button class="icon-btn small" id="editBtn" title="编辑常用链接"></button>
    </div>
    <div class="edit-bar" id="editBar">
      <button class="tbtn primary" id="addBtn">+ 添加</button>
      <button class="tbtn" id="reloadBtn">从文件重载</button>
      <button class="tbtn" id="exportBtn">保存到文件</button>
      <button class="tbtn" id="doneBtn">完成</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer">Qutebrowser</div>
  </main>
</div>
<div class="overlay" id="dlg">
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 id="dlgTitle">添加链接</h3>
    <label class="field">名称<input id="dName" type="text" placeholder="链接名称"></label>
    <label class="field">网址<input id="dUrl" type="text" placeholder="https://example.com"></label>
    <div class="field">
      <span class="flabel">图标</span>
      <div class="icon-picker" id="dIcon"></div>
    </div>
    <div class="dialog-actions">
      <button class="dbtn cancel" id="dCancel">取消</button>
      <button class="dbtn save" id="dSave">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="quickmarks.js"></script>
<script src="links.js"></script>

var ICON_CHOICES=['github','code','link','forum','article','chat','live','sub','translate','wiki','storage','download','flag','star','mail','home','cloud','place','school','music','image','cart','date_range'];
var ACCENTS=[
  ["var(--primary-container)","var(--on-primary-container)"],
  ["var(--secondary-container)","var(--on-secondary-container)"],
  ["var(--tertiary-container)","var(--on-tertiary-container)"]
];
var WEEK=["日","一","二","三","四","五","六"];
var grid=document.getElementById("grid"),q=document.getElementById("q");

var themeSlider=document.getElementById("themeSlider");
var tsThumb=themeSlider?themeSlider.querySelector(".ts-thumb"):null;
var tsIc=tsThumb?tsThumb.querySelector(".ts-ic"):null;
function tsStops(){
  var w=themeSlider?themeSlider.clientWidth:88;
  return [w/6,w/2,w*5/6];
}
var BOOKMARKS=typeof BOOKMARKS!=='undefined'?BOOKMARKS:[];
var QUICKMARKS=typeof QUICKMARKS!=='undefined'?QUICKMARKS:[];
var FILE_LINKS=(typeof LINKS!=='undefined'&&Array.isArray(LINKS))?LINKS.slice():[];
var LINKS=(function(){
  try{
    var raw=localStorage.getItem('m2links');
    if(raw){var arr=JSON.parse(raw);if(Array.isArray(arr))return arr;}
  }catch(e){}
  return FILE_LINKS.map(function(l){return {name:l.name,url:l.url,icon:l.icon||''};});
})();
function persistLinks(){
  try{localStorage.setItem('m2links',JSON.stringify(LINKS));}catch(e){}
  try{history.replaceState(null,'',location.pathname+'#qblinks='+encodeURIComponent(JSON.stringify(LINKS)));}catch(e){}
}
var engineIdx=parseInt(localStorage.getItem('m2engine')||'0',10);

function svg(icon){return '<svg viewBox="0 0 24 24" fill="currentColor">'+ICONS[icon]+'</svg>';}
function pad(n){return n<10?'0'+n:''+n;}

function tick(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes();
  var g=h<5?'凌晨好':h<9?'早上好':h<12?'上午好':h<14?'中午好':h<18?'下午好':'晚上好';
  document.getElementById("greeting").textContent=g;
  document.getElementById("clock").textContent=pad(h)+':'+pad(m);
  document.getElementById("date").textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+WEEK[d.getDay()];
}
var themeMode=localStorage.getItem('m2theme')||'auto';
function sysDark(){return window.matchMedia?matchMedia('(prefers-color-scheme: dark)').matches:false;}
function applyTheme(mode){
  themeMode=mode;
  try{localStorage.setItem('m2theme',mode);}catch(e){}
  var t=mode==='auto'?(sysDark()?'dark':'light'):mode;
  document.documentElement.setAttribute('data-theme',t);
  updateTheme();
}
function updateTheme(){
  var t=document.documentElement.getAttribute('data-theme');
  var s=tsStops();
  var left=(s[themeMode==='dark'?0:(themeMode==='light'?2:1)]-13);
  if(tsThumb)tsThumb.style.left=left+'px';
  if(tsIc)tsIc.innerHTML=svg(themeMode==='auto'?'system':(t==='light'?'light':'dark'));
  var marks=themeSlider?themeSlider.querySelectorAll('.ts-mark'):[];
  for(var mi=0;mi<marks.length;mi++){
    var on=marks[mi].dataset.mode===themeMode;
    if(marks[mi].classList.contains('active')!==on)marks[mi].classList.toggle('active',on);
  }
}
function renderQuickmarks(){
  var marks=QUICKMARKS&&QUICKMARKS.length?QUICKMARKS:BOOKMARKS;
  if(!marks||!marks.length)return;
  bmBar.innerHTML='';
  marks.forEach(function(b){
    if(!b||!b.url)return;
    var a=document.createElement('a');
    a.className='chip';
    a.href=b.url;
    a.title=b.url;
    var esc=(b.name&&b.name!=='')?b.name:b.url;
    a.innerHTML=svg('star')+'<span class="txt">'+esc+'</span>';
    a.addEventListener('pointerdown',ripple);
    bmBar.appendChild(a);
  });
  if(bmBar.childNodes.length)bmSection.hidden=false;
}
function hostname(u){
  try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return (u||'').replace(/^https?:\/\//,'').split('/')[0];}
}
function renderLinks(){
  grid.innerHTML='';
  LINKS.forEach(function(l,i){
    var a=document.createElement('a');
    a.className='card';a.href=l.url;a.target='_self';a.dataset.index=i;
    var ac=ACCENTS[i%ACCENTS.length];
    var ick=(l.icon&&ICONS[l.icon])?l.icon:'link';
    var nm=l.name&&l.name!==''?l.name:(l.url||'');
    a.innerHTML='<span class="icon" style="background:'+ac[0]+';color:'+ac[1]+'">'+svg(ick)+'</span>'+
      '<span class="meta"></span>'+
      '<span class="card-actions"><button class="cbtn edit" title="修改">'+svg('edit')+'</button>'+
      '<button class="cbtn del" title="删除">'+svg('trash')+'</button></span>';
    var meta=a.querySelector('.meta');
    var n=document.createElement('span');n.className='name';n.textContent=nm;
    var d=document.createElement('span');d.className='domain';d.textContent=hostname(l.url);
    meta.appendChild(n);meta.appendChild(d);
    a.addEventListener('pointerdown',ripple);
    var cbs=a.querySelectorAll('.cbtn');
    for(var j=0;j<cbs.length;j++)cbs[j].addEventListener('pointerdown',ripple);
    grid.appendChild(a);
  });
}
function renderEngine(){refreshEngineBtn();engineMenu.innerHTML='';
  ENGINES.forEach(function(eng,i){
    var item=document.createElement('div');
    item.className='item'+(i===engineIdx?' active':'');
    item.setAttribute('role','menuitem');
    item.tabIndex=0;
    item.innerHTML='<span class="name">'+eng.name+'</span><span class="hint">'+eng.hint+'</span><span class="check">'+svg('check')+'</span>';
    item.addEventListener('pointerdown',ripple);
    item.addEventListener('click',function(){selectEngine(i);});
    item.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectEngine(i);}});
    engineMenu.appendChild(item);
  });
}
function refreshEngineBtn(){
  var e=ENGINES[engineIdx];
  var nm=engineBtn.querySelector('.eb-name');
  if(!nm){
    engineBtn.innerHTML='<span class="eb-name"></span>'+svg('arrow');
    nm=engineBtn.querySelector('.eb-name');
  }
  nm.textContent=e.name;
}
function selectEngine(i){
  engineIdx=i;localStorage.setItem('m2engine',i);
  refreshEngineBtn();
  setTimeout(function(){renderEngine();closeMenu();},540);
}
function openMenu(){renderEngine();engineMenu.classList.add('open');}
function closeMenu(){engineMenu.classList.remove('open');}
function ripple(ev,cap){
  if(editing)return;
  var el=ev.currentTarget,rect=el.getBoundingClientRect();
  var d=Math.hypot(rect.width,rect.height)*2;
  if(cap&&d>cap)d=cap;
  var r=document.createElement('span');
  r.className='ripple';
  r.style.width=r.style.height=d+'px';
  r.style.left=(ev.clientX-rect.left-d/2)+'px';
  r.style.top=(ev.clientY-rect.top-d/2)+'px';
  el.appendChild(r);
  r.addEventListener('animationend',function(){r.parentNode&&r.parentNode.removeChild(r);});
}
var editing=false;
var dlg=document.getElementById('dlg');
var dName=document.getElementById('dName'),dUrl=document.getElementById('dUrl');
var dIcon=document.getElementById('dIcon');
var editBtn=document.getElementById('editBtn');
var editingIndex=-1,selIcon='';
var toastEl=document.getElementById('toast'),toastTimer;
function toggleEdit(){
  editing=!editing;
  document.body.classList.toggle('editing',editing);
  editBtn.innerHTML=svg(editing?'check':'edit');
  editBtn.classList.toggle('active',editing);
}
function buildPicker(){
  dIcon.innerHTML='';
  var def=document.createElement('button');
  def.type='button';def.className='ipick';def.dataset.icon='';
  def.title='默认';
  def.innerHTML=svg('link');
  dIcon.appendChild(def);
  ICON_CHOICES.forEach(function(k){
    var b=document.createElement('button');
    b.type='button';b.className='ipick';b.dataset.icon=k;
    b.title=k;b.innerHTML=svg(k);
    dIcon.appendChild(b);
  });
}
function renderPicker(sel){
  Array.prototype.forEach.call(dIcon.children,function(b){
    var v=b.dataset.icon||'';
    b.classList.toggle('selected',v===(sel||''));
  });
}
function openDialog(index){
  editingIndex=index;
  document.getElementById('dlgTitle').textContent=index>=0?'修改链接':'添加链接';
  dName.value=index>=0?(LINKS[index].name||''):'';
  dUrl.value=index>=0?(LINKS[index].url||''):'';
  selIcon=(index>=0&&LINKS[index].icon&&ICONS[LINKS[index].icon])?LINKS[index].icon:'';
  renderPicker(selIcon);
  dlg.classList.add('open');
  dName.focus();
}
function closeDialog(){dlg.classList.remove('open');}
function saveDialog(){
  var name=dName.value.trim(),url=dUrl.value.trim();
  if(!name){toast('请输入名称');dName.focus();return;}
  if(!url){toast('请输入网址');dUrl.focus();return;}
  if(!/^https?:\/\//.test(url))url='https://'+url;
  var obj={name:name,url:url,icon:selIcon};
  if(editingIndex>=0)LINKS[editingIndex]=obj;else LINKS.push(obj);
  persistLinks();renderLinks();closeDialog();toast('已保存');
}
function deleteLink(i){
  LINKS.splice(i,1);persistLinks();renderLinks();toast('已保存');
}
function reloadLinks(){
  try{localStorage.removeItem('m2links');}catch(e){}
  try{sessionStorage.setItem('m2justreloaded','1');}catch(e){}
  location.reload();
}
function exportLinks(){
  var lines=['# 常用链接：名称 | 网址 | 图标（可留空）'];
  LINKS.forEach(function(l){lines.push((l.name||'')+' | '+(l.url||'')+' | '+(l.icon||''));});
  copyText(lines.join('\n'));
  toast('已复制；按 ,s 可直接写入 links.txt');
}
function copyText(text){
  function done(){toast('已复制；按 ,s 可直接写入 links.txt');}
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
    done();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('已复制；按 ,s 可直接写入 links.txt');},fallback);
  }else{fallback();}
}
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1800);
}
grid.addEventListener('click',function(ev){
  var btn=ev.target.closest('.cbtn');
  var card=ev.target.closest('.card');
  if(btn&&card){
    ev.preventDefault();ev.stopPropagation();
    var i=parseInt(card.dataset.index,10);
    if(i>=0&&i<LINKS.length){
      if(btn.classList.contains('del'))deleteLink(i);
      else openDialog(i);
    }
    return;
  }
  if(editing&&card)ev.preventDefault();
});
editBtn.addEventListener('click',toggleEdit);
document.getElementById('addBtn').addEventListener('click',function(){openDialog(-1);});
document.getElementById('reloadBtn').addEventListener('click',reloadLinks);
document.getElementById('exportBtn').addEventListener('click',exportLinks);
document.getElementById('doneBtn').addEventListener('click',toggleEdit);
dIcon.addEventListener('click',function(ev){
  var b=ev.target.closest('.ipick');if(!b)return;
  selIcon=b.dataset.icon||'';
  renderPicker(selIcon);
});
document.getElementById('dCancel').addEventListener('click',closeDialog);
document.getElementById('dSave').addEventListener('click',saveDialog);
dName.addEventListener('keydown',function(ev){if(ev.key==='Enter')saveDialog();});
dUrl.addEventListener('keydown',function(ev){if(ev.key==='Enter')saveDialog();});
dlg.addEventListener('mousedown',function(ev){if(ev.target===dlg)closeDialog();});
function submit(){
  var v=q.value.trim();
  if(!v)return;
  location.href=ENGINES[engineIdx].tpl.replace('{q}',encodeURIComponent(v));
}
engineBtn.addEventListener('mousedown',function(ev){ev.preventDefault();});
engineBtn.addEventListener('click',function(ev){ev.stopPropagation();engineMenu.classList.contains('open')?closeMenu():openMenu();if(ev.detail>0)engineBtn.blur();});
document.addEventListener('click',function(ev){if(!ev.target.closest('.search-wrap'))closeMenu();});
q.addEventListener('keydown',function(ev){
  if(ev.key==='Enter')submit();
  else if(ev.key==='Escape'){
    if(q.value)q.value='';else q.blur();
    closeMenu();
  }
});
if(themeSlider){
  var tsDrag=null,tsStartX=null,tsMoved=false;
  function tsMove(x){
    var v=x-13;
    var s=tsStops();
    var lo=s[0]-13,hi=s[2]-13;
    if(v<lo)v=lo;if(v>hi)v=hi;
    if(tsThumb)tsThumb.style.left=v+'px';
  }
  function tsSnap(){
    var cur=(tsThumb?(parseFloat(tsThumb.style.left)||0):0)+13;
    var s=tsStops();
    var n=0;var best=1e9;
    for(var i=0;i<3;i++){
      var d=Math.abs(s[i]-cur);
      if(d<best){best=d;n=i;}
    }
    applyTheme(['dark','auto','light'][n]);
  }
  function tsPick(x){
    var s=tsStops();
    var n=0;var best=1e9;
    for(var i=0;i<3;i++){
      var d=Math.abs(s[i]-x);
      if(d<best){best=d;n=i;}
    }
    applyTheme(['dark','auto','light'][n]);
  }
  themeSlider.addEventListener('pointerdown',function(ev){
    ev.preventDefault();
    tsDrag=true;tsMoved=false;tsStartX=ev.clientX;
    if(themeSlider.setPointerCapture)themeSlider.setPointerCapture(ev.pointerId);
  });
  themeSlider.addEventListener('pointermove',function(ev){
    if(!tsDrag)return;
    if(!tsMoved&&Math.abs(ev.clientX-tsStartX)>4){
      tsMoved=true;themeSlider.classList.add('drag');
    }
    if(tsMoved){
      var r=themeSlider.getBoundingClientRect();
      tsMove(ev.clientX-r.left);
    }
  });
  ['pointerup','pointercancel'].forEach(function(t){
    themeSlider.addEventListener(t,function(ev){
      if(!tsDrag)return;
      tsDrag=false;
      themeSlider.classList.remove('drag');
      if(tsMoved){
        if(tsThumb)void tsThumb.offsetWidth;
        tsSnap();
      }else{
        var r=themeSlider.getBoundingClientRect();
        var x=(ev&&ev.clientX!=null)?(ev.clientX-r.left):r.width/2;
        tsPick(x);
      }
    });
  });
  var tmarks=themeSlider.querySelectorAll('.ts-mark');
  for(var tmi=0;tmi<tmarks.length;tmi++){
    var mo=tmarks[tmi].dataset.mode==='dark'?'dark':(tmarks[tmi].dataset.mode==='light'?'light':'system');
    tmarks[tmi].innerHTML=svg(mo);
    var stop=tmarks[tmi].dataset.mode==='dark'?0:(tmarks[tmi].dataset.mode==='light'?2:1);
    var off=stop===0?3:(stop===2?-3:0);
    tmarks[tmi].style.left=(tsStops()[stop]+off)+'px';
  }
  themeSlider.addEventListener('pointerdown',function(ev){ripple(ev,72);});
}
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
  if(themeMode==='auto')applyTheme('auto');
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape')return;
  if(ev.target===q){return;}
  if(dlg.classList.contains('open'))closeDialog();
  else if(editing)toggleEdit();
});
var sbEl=document.getElementById("sb");
function scrollbarTick(){
  if(!sbEl)return;
  var doc=document.documentElement;
  var max=doc.scrollHeight-doc.clientHeight;
  if(max<=0){sbEl.style.display='none';return;}
  var y=window.scrollY||doc.scrollTop||0;
  if(y<0)y=0;
  var h=Math.max(28,(doc.clientHeight*doc.clientHeight)/doc.scrollHeight);
  sbEl.style.display='block';
  sbEl.style.height=Math.round(h)+'px';
  sbEl.style.top=Math.round((y/max)*(doc.clientHeight-h))+'px';
}
window.addEventListener('scroll',scrollbarTick,{passive:true});
window.addEventListener('resize',scrollbarTick);
var sbDrag=null;
if(sbEl){
  sbEl.addEventListener('pointerdown',function(e){
    sbDrag={off:e.clientY-parseFloat(sbEl.style.top||'0')};
    sbEl.setPointerCapture(e.pointerId);
    sbEl.classList.add('sb-drag');
  });
  sbEl.addEventListener('pointermove',function(e){
    if(!sbDrag)return;
    var doc=document.documentElement;
    var max=doc.scrollHeight-doc.clientHeight;
    if(max<=0)return;
    var h=Math.max(28,(doc.clientHeight*doc.clientHeight)/doc.scrollHeight);
    var frac=(e.clientY-sbDrag.off)/(doc.clientHeight-h);
    window.scrollTo(0,frac*max);
  });
  sbEl.addEventListener('pointerup',function(){sbDrag=null;sbEl.classList.remove('sb-drag');});
  sbEl.addEventListener('pointercancel',function(){sbDrag=null;sbEl.classList.remove('sb-drag');});
}
renderLinks();renderQuickmarks();renderEngine();updateTheme();tick();buildPicker();
if(themeSlider){void themeSlider.offsetWidth;themeSlider.classList.add('ready');}
var rippleIds=['engineBtn','addBtn','reloadBtn','exportBtn','doneBtn','dSave','dCancel'];
for(var ri=0;ri<rippleIds.length;ri++){var re=document.getElementById(rippleIds[ri]);if(re)re.addEventListener('pointerdown',ripple);}
scrollbarTick();
persistLinks();
editBtn.innerHTML=svg('edit');
setInterval(tick,15000);
if(sessionStorage.getItem('m2justreloaded')){
  try{sessionStorage.removeItem('m2justreloaded');}catch(e){}
  toast('已从文件重新加载');
}
</script>
</body>
