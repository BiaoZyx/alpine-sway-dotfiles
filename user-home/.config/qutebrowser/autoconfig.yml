# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  content.blocking.enabled:
    https://signup.simcc.net.cn/: false
  content.headers.do_not_track:
    global: false
  content.headers.user_agent:
    coding.qq.com: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
      like Gecko) Chrome/140.0.0.0 Safari/537.36
  content.javascript.clipboard:
    file://: access-paste
    https://chat.deepseek.com: access-paste
    https://codeberg.org: access-paste
    https://danklinux.com: access-paste
    https://gh-proxy.com: access-paste
    https://github.com: access-paste
    https://help.mirror.nju.edu.cn: access-paste
    https://help.mirrors.cernet.edu.cn: access-paste
    https://lichess.org: access-paste
  content.mouse_lock:
    http://copy.sh: true
  content.proxy:
    global: system
  content.user_stylesheets:
    global: []
  editor.command:
    global:
    - micro
    - -f
    - '{file}'
    - -c
    - normal {line}G{column0}l
  fonts.default_family:
    global: Noto Sans CJK SC
  fonts.messages.error:
    global: 10pt "JetBrainsMono Nerd Font Mono"
  fonts.messages.info:
    global: 10pt "JetBrainsMono Nerd Font Mono"
  fonts.messages.warning:
    global: 10pt "JetBrainsMono Nerd Font Mono"
  fonts.prompts:
    global: 11pt "JetBrainsMono Nerd Font Mono"
  fonts.statusbar:
    global: 11pt "JetBrainsMono Nerd Font Mono"
  fonts.web.family.fixed:
    global: JetBrainsMono Nerd Font Mono
  hints.auto_follow:
    global: unique-match
  url.default_page:
    global: https://inftab.com/
  url.searchengines:
    global:
      DEFAULT: https://cn.bing.com/q?search={}
  url.start_pages:
    global: https://inftab.com/
  url.yank_ignored_parameters:
    global:
    - ref
    - utm_source
    - utm_medium
    - utm_campaign
    - utm_term
    - utm_content
    - utm_name
