# 全局默认配置 (无 section 名)
# 位置与间距
anchor = top-right
edge-margin-vertical = 12
edge-margin-horizontal = 12
notification-margin = 8
padding-vertical = 14
padding-horizontal = 16
min-width = 300
max-width = 450

# 永远不自动消失，靠快捷键清理
default-timeout = 0

# 外观：方正、紫黑
background = 12101Aee      # 深紫黑背景，带 93% 左右的不透明度 (ee)
border-color = 7A6BCEee    # 亮紫色边框，呼应你的 Sway 边框
border-size = 2            # 边框加粗到 2px
border-radius = 0          # 彻底干掉圆角，对齐 Waybar 和 Fuzzel

# 文本颜色
title-color = C4BAE8ff     # 亮薰衣草紫标题
body-color = D8D0F5ff      # 淡紫白正文

# 字体
title-font = JetBrainsMono Nerd Font:weight=bold:size=11
summary-font = Noto Sans CJK SC:size=12
body-font = Noto Sans CJK SC:italic:size=11
